name: innogram

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-innogram}
      POSTGRES_USER: ${POSTGRES_USER:-innogram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-innogram}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  core:
    build:
      context: .
      dockerfile: apps/core_microservice/Dockerfile
    environment:
      PORT: 3001
    ports:
      - "${CORE_PORT:-3001}:3001"
    depends_on:
      - postgres
      - redis

  auth:
    build:
      context: .
      dockerfile: apps/auth_microservice/Dockerfile
    environment:
      PORT: 3002
    ports:
      - "${AUTH_PORT:-3002}:3002"
    depends_on:
      - postgres
      - redis

  notifications:
    build:
      context: .
      dockerfile: apps/notifications_consumer_microservice/Dockerfile
    environment:
      PORT: 3003
    ports:
      - "${NOTIFICATIONS_PORT:-3003}:3003"
    depends_on:
      - postgres
      - rabbitmq

  client:
    build:
      context: .
      dockerfile: apps/client_app/Dockerfile
    environment:
      PORT: 3000
    ports:
      - "${CLIENT_PORT:-3000}:3000"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
