name: Core Tests

on:
  push: {}
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @innogram/shared
      - run: npm test --workspace core
      - run: npm run test:e2e --workspace core
