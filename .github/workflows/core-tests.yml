name: Core Tests

on:
  push: {}
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://innogram:test-password@localhost:5432/innogram
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: innogram
          POSTGRES_USER: innogram
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U innogram -d innogram"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @innogram/shared
      - run: npm run build --workspace core
      - run: npm run migration:run --workspace core
      - run: npm test --workspace core
      - run: npm run test:e2e --workspace core
